<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport"content="width=device-width,initial-cale=1.0">
        <title>Student Registration Form</title>
        <link rel="stylesheet"href="stylee.css">
    </head>
    <body>
        <h2>Student Registration Form</h2>
        <form action="/Submit-Registration"method="post">
            <label for="first name">First Name</label>
            <input type="text"id="firstName="name="firstName"required><br><br>

            <label for="last name">Last Name</label>
            <input type="text"id="lastName="name="lastName"required><br><br>

            <label for="dob">Date Of Birth</label>
            <input type="date"id="dob="name="dob"required><br><br>

            <label>Gender</label><br>
            <input type="radio" id="male"name="gender"value="male"required>
            <label for="male">Male</label><br>

            <input type="radio" id="female"name="gender"value="female"required>
            <label for="female">Female</label><br>

            <input type="radio" id="other"name="gender"value="other"required>
            <label for="other">Other</label><br><br>

            <label for="course">Preffered Courses:</label><br>
            <select id="course"name="course"required>
                <option value="BCA">Bachelor of Computer Application</option>
                <option value="BBA">Bachelor of Business Administration</option>
                <option value="BA">Bachelor of Arts</option>
                <option value="B.Sc">Bachelor of Science</option>
                <option value="B.Com">Bachelor of Commerce</option>
            </select> <br><br>

            <label>Additional Interests:</label><br>
            <input type="checkbox"id="sports"name="interest"value="sports">
            <label for="sports">Sports</label><br>

            <input type="checkbox"id="music"name="interest"value="music">
            <label for="music">Music</label><br>

            <input type="checkbox"id="arts"name="interest"value="arts">
            <label for="arts">Arts</label><br>

            <input type="checkbox"id="science club "name="interest"value="science club">
            <label for="science club ">Science Club</label><br>

            <input type="checkbox"id="debate"name="interest"value="debate">
            <label for="debate">Debate</label><br><br>
            

            <label for="address">Address</label><br>
            <input type="text"id="address"name="address"required><br><br>

            <label for="email">Email</label><br>
            <input type="email"id="email"name="email"required><br><br>

            <label for="phone">Phone</label><br>
            <input type="tel"id="phone"name="phone"required><br><br>

            <button type="submit">Submit</button>
        </form>
        <script src="s.js"></script>
    </body>
</html>
